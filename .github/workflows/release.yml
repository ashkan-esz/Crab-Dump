name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/${{ github.repository }}
  SING_BOX_VERSION: "1.11.15"
  SHOES_REVISION: "7a5a8ee3bd1c52bc15ec57e074e95e374d41f275"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate release version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Check tag matches Cargo version
        id: version
        shell: bash
        run: |
          package_version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')"
          tag_version="${GITHUB_REF_NAME#v}"
          test "$tag_version" = "$package_version"
          echo "version=$package_version" >> "$GITHUB_OUTPUT"

  quality:
    name: Quality gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-quality-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-quality-

      - name: Run quality gates
        run: |
          cargo fmt --all --check
          cargo clippy --all-targets -- -D warnings
          cargo test

  binaries:
    name: Build ${{ matrix.target }}
    needs: [validate, quality]
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ matrix.target }}-

      - name: Install musl toolchain
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install --yes musl-tools

      - name: Install musl toolchain
        if: matrix.target == 'aarch64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install --yes musl-tools

      - name: Build binary
        run: cargo build --release --target "${{ matrix.target }}"

      - name: Package binary
        shell: bash
        run: |
          version="${{ needs.validate.outputs.version }}"
          archive="crab-dump-v${version}-${{ matrix.target }}"
          mkdir "$archive"
          cp "target/${{ matrix.target }}/release/crab-dump" "$archive/"
          cp README.md CHANGELOG.md "$archive/"
          tar -czf "${archive}.tar.gz" "$archive"
          sha256sum "${archive}.tar.gz" > "${archive}.tar.gz.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: |
            crab-dump-*.tar.gz
            crab-dump-*.tar.gz.sha256

  release:
    name: Create GitHub Release
    needs: [validate, binaries]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: release-*
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/*

  core-images:
    name: Build ${{ matrix.core }} (${{ matrix.slug }})
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - core: sing-box
            build_target: singbox-image
            image_name: sing-box
            version: "1.11.15"
            platform: linux/amd64
            runner: ubuntu-latest
            slug: amd64
          - core: sing-box
            build_target: singbox-image
            image_name: sing-box
            version: "1.11.15"
            platform: linux/arm64
            runner: ubuntu-24.04-arm
            slug: arm64
          - core: shoes
            build_target: shoes-image
            image_name: shoes
            version: "7a5a8ee3bd1c52bc15ec57e074e95e374d41f275"
            platform: linux/amd64
            runner: ubuntu-latest
            slug: amd64
          - core: shoes
            build_target: shoes-image
            image_name: shoes
            version: "7a5a8ee3bd1c52bc15ec57e074e95e374d41f275"
            platform: linux/arm64
            runner: ubuntu-24.04-arm
            slug: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Start core build timer
        run: echo "CORE_BUILD_START=$(date +%s)" >> "$GITHUB_ENV"

      - name: Build and publish core
        uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.build_target }}
          platforms: ${{ matrix.platform }}
          push: true
          tags: ${{ env.IMAGE_NAME }}-${{ matrix.image_name }}:${{ matrix.version }}-${{ matrix.slug }}
          cache-from: type=gha,scope=${{ matrix.image_name }}-${{ matrix.slug }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image_name }}-${{ matrix.slug }}

      - name: Report core build duration
        if: always()
        shell: bash
        run: |
          end="$(date +%s)"
          duration=$((end - CORE_BUILD_START))
          echo "Core build duration: ${duration}s" >> "$GITHUB_STEP_SUMMARY"

  container:
    name: Build ${{ matrix.platform }}
    needs: [validate, binaries, core-images]
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            slug: amd64
            target: x86_64-unknown-linux-musl
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            slug: arm64
            target: aarch64-unknown-linux-musl
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: actions/download-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: /tmp/release

      - name: Prepare release binary
        shell: bash
        run: |
          tar -xzf /tmp/release/crab-dump-*.tar.gz -C /tmp/release
          cp /tmp/release/crab-dump-*/crab-dump ./crab-dump

      - name: Start image build timer
        run: echo "IMAGE_BUILD_START=$(date +%s)" >> "$GITHUB_ENV"

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}

      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          target: runtime-all-prebuilt
          platforms: ${{ matrix.platform }}
          push: true
          outputs: type=image,name=${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=runtime-${{ matrix.slug }}
          cache-to: type=gha,mode=max,scope=runtime-${{ matrix.slug }}
          build-args: |
            APP_VERSION=${{ needs.validate.outputs.version }}
            SING_BOX_IMAGE=${{ env.IMAGE_NAME }}-sing-box:${{ env.SING_BOX_VERSION }}-${{ matrix.slug }}
            SHOES_IMAGE=${{ env.IMAGE_NAME }}-shoes:${{ env.SHOES_REVISION }}-${{ matrix.slug }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Report image build duration
        if: always()
        shell: bash
        run: |
          end="$(date +%s)"
          duration=$((end - IMAGE_BUILD_START))
          echo "Image build duration: ${duration}s" >> "$GITHUB_STEP_SUMMARY"

      - name: Export image digest
        shell: bash
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@v4
        with:
          name: image-digest-${{ matrix.slug }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  container-manifest:
    name: Publish GHCR manifest
    needs: [validate, container]
    runs-on: ubuntu-latest
    steps:
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: image-digest-*
          merge-multiple: true

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}

      - name: Publish multi-architecture manifest
        shell: bash
        run: |
          mapfile -t sources < <(
            for digest in /tmp/digests/*; do
              printf '%s@sha256:%s\n' "${{ env.IMAGE_NAME }}" "$(basename "$digest")"
            done
          )
          mapfile -t tags < <(printf '%s\n' "${{ steps.meta.outputs.tags }}" | sed '/^$/d')
          args=()
          for tag in "${tags[@]}"; do
            args+=("-t" "$tag")
          done
          docker buildx imagetools create "${args[@]}" "${sources[@]}"
