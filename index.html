<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>crab-dump · Status Dashboard</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg:         #0b0f19;
            --bg-card:    #111827;
            --bg-hover:   #1a2332;
            --border:     #1e293b;
            --text:       #e2e8f0;
            --text-muted: #64748b;
            --accent:     #3b82f6;
            --accent-glow:rgba(59,130,246,.25);
            --up:         #22c55e;
            --up-bg:      rgba(34,197,94,.10);
            --up-border:  rgba(34,197,94,.30);
            --up-glow:    rgba(34,197,94,.35);
            --warn:       #f59e0b;
            --warn-bg:    rgba(245,158,11,.10);
            --warn-border:rgba(245,158,11,.30);
            --warn-glow:  rgba(245,158,11,.35);
            --err:        #ef4444;
            --err-bg:     rgba(239,68,68,.10);
            --err-border: rgba(239,68,68,.30);
            --err-glow:   rgba(239,68,68,.35);
            --idle:       #7c8aa0;
            --idle-bg:    rgba(124,138,160,.10);
            --idle-border:rgba(124,138,160,.28);
            --radius:     14px;
            --font:       'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            --mono:       'JetBrains Mono', 'Fira Code', 'Cascadia Code', ui-monospace, monospace;
        }

        body {
            font-family: var(--font);
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2rem 1rem;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* ---------- header ---------- */
        .header {
            width: 100%;
            max-width: 920px;
            text-align: center;
            margin-bottom: 2rem;
        }
        .header h1 {
            font-size: 1.6rem;
            font-weight: 700;
            letter-spacing: -.02em;
            margin-bottom: .3rem;
        }
        .header h1 .dot {
            display: inline-block;
            width: 10px; height: 10px;
            border-radius: 50%;
            background: var(--accent);
            box-shadow: 0 0 10px var(--accent-glow);
            margin-right: .5rem;
            vertical-align: middle;
            animation: pulse-dot 2s ease-in-out infinite;
        }
        @keyframes pulse-dot {
            0%,100% { opacity:1; transform:scale(1); }
            50%     { opacity:.5; transform:scale(1.2); }
        }
        .header p {
            color: var(--text-muted);
            font-size: .9rem;
        }

        /* ---------- server info bar ---------- */
        .info-bar {
            width: 100%;
            max-width: 920px;
            display: flex;
            flex-wrap: wrap;
            gap: .75rem;
            margin-bottom: 1.5rem;
        }
        .info-chip {
            display: inline-flex;
            align-items: center;
            gap: .45rem;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 999px;
            padding: .4rem .9rem;
            font-size: .78rem;
            color: var(--text-muted);
            font-family: var(--mono);
            white-space: nowrap;
        }
        .info-chip .icon { font-size: .9rem; }
        .info-chip strong { color: var(--text); font-weight: 600; }

        /* ---------- status grid ---------- */
        .grid {
            width: 100%;
            max-width: 920px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.25rem;
        }
        @media (max-width: 640px) {
            .grid { grid-template-columns: 1fr; }
        }

        /* ---------- card base ---------- */
        .card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 1.5rem;
            transition: border-color .3s, box-shadow .3s, transform .15s;
            display: flex;
            flex-direction: column;
            gap: 1rem;
            position: relative;
            overflow: hidden;
        }
        .card::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: var(--radius);
            opacity: 0;
            transition: opacity .3s;
            pointer-events: none;
            background: radial-gradient(600px circle at var(--mx, 50%) var(--my, 50%), rgba(255,255,255,.02), transparent 40%);
        }
        .card:hover::before { opacity: 1; }
        .card:hover { transform: translateY(-2px); }

        /* state variants */
        .card.up       { border-color: var(--up-border);   box-shadow: 0 0 20px rgba(34,197,94,.06); }
        .card.up .card-header .status-dot { background: var(--up); box-shadow: 0 0 10px var(--up-glow); }
        .card.degraded { border-color: var(--warn-border); box-shadow: 0 0 20px rgba(245,158,11,.06); }
        .card.degraded .card-header .status-dot { background: var(--warn); box-shadow: 0 0 10px var(--warn-glow); }
        .card.down     { border-color: var(--err-border);  box-shadow: 0 0 20px rgba(239,68,68,.06); }
        .card.down .card-header .status-dot { background: var(--err); box-shadow: 0 0 10px var(--err-glow); }

        .card-header {
            display: flex;
            align-items: center;
            gap: .75rem;
        }
        .status-dot {
            width: 12px; height: 12px;
            border-radius: 50%;
            flex-shrink: 0;
            animation: pulse-dot 2s ease-in-out infinite;
        }
        .card-title {
            font-size: .95rem;
            font-weight: 600;
            color: var(--text);
        }
        .card-body { flex: 1; }
        .card-body .status-msg {
            font-size: .85rem;
            color: var(--text-muted);
            line-height: 1.55;
        }
        .card-body .status-time {
            font-family: var(--mono);
            font-size: .72rem;
            color: var(--text-muted);
            opacity: .7;
            margin-top: .4rem;
        }

        /* ──────────────────────────────────────────────
           DATABASES SECTION
           ────────────────────────────────────────────── */

        /* Section heading */
        #dbSection { width: 100%; max-width: 920px; }
        .db-head {
            width: 100%;
            max-width: 920px;
            display: flex;
            align-items: baseline;
            gap: .6rem;
            margin: 2rem 0 .9rem;
        }
        .db-head h2 {
            font-size: 1rem;
            font-weight: 600;
            letter-spacing: -.01em;
        }
        .db-head .hint {
            font-family: var(--mono);
            font-size: .68rem;
            color: var(--text-muted);
            opacity: .7;
        }

        /* Summary row pills */
        .summary-row {
            width: 100%;
            max-width: 920px;
            display: flex;
            flex-wrap: wrap;
            gap: .5rem;
            margin: 0 0 1.25rem;
        }
        .summary-pill {
            display: inline-flex;
            align-items: center;
            gap: .35rem;
            padding: .3rem .75rem;
            border-radius: 999px;
            font-size: .72rem;
            font-weight: 600;
            font-family: var(--mono);
            letter-spacing: .03em;
        }
        .summary-pill.total   { background: rgba(59,130,246,.12);  color: var(--accent);    border: 1px solid rgba(59,130,246,.25); }
        .summary-pill.queued  { background: var(--idle-bg);        color: var(--idle);     border: 1px solid var(--idle-border); }
        .summary-pill.running { background: rgba(245,158,11,.12);  color: var(--warn);     border: 1px solid rgba(245,158,11,.25); }
        .summary-pill.done    { background: rgba(34,197,94,.12);   color: var(--up);       border: 1px solid rgba(34,197,94,.25); }
        .summary-pill.failed  { background: rgba(239,68,68,.12);   color: var(--err);      border: 1px solid rgba(239,68,68,.25); }
        .summary-pill.size    { background: rgba(226,232,240,.05); color: var(--text);     border: 1px solid var(--border); }
        .summary-pill.speed   { background: rgba(245,158,11,.12);  color: var(--warn);     border: 1px solid rgba(245,158,11,.25); }
        .summary-pill.zero    { opacity: .4; }

        /* Database cards container */
        .db-grid {
            width: 100%;
            max-width: 920px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 1rem;
        }
        @media (max-width: 720px) {
            .db-grid { grid-template-columns: 1fr; }
        }

        /* Individual database card */
        .db-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-left: 3px solid var(--idle);
            border-radius: var(--radius);
            padding: 1.05rem 1.15rem;
            display: flex;
            flex-direction: column;
            gap: .8rem;
            transition: border-color .3s, box-shadow .3s, transform .15s;
            position: relative;
            overflow: hidden;
        }
        .db-card::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: var(--radius);
            opacity: 0;
            transition: opacity .3s;
            pointer-events: none;
            background: radial-gradient(600px circle at var(--mx, 50%) var(--my, 50%), rgba(255,255,255,.02), transparent 40%);
        }
        .db-card:hover::before { opacity: 1; }
        .db-card:hover { transform: translateY(-2px); }

        /* State accents — border-color first, then the left edge overrides it */
        .db-card.running { border-color: var(--warn-border); border-left-color: var(--warn); box-shadow: 0 0 16px rgba(245,158,11,.06); }
        .db-card.done    { border-color: var(--up-border);   border-left-color: var(--up);   box-shadow: 0 0 16px rgba(34,197,94,.06); }
        .db-card.failed  { border-color: var(--err-border);  border-left-color: var(--err);  box-shadow: 0 0 16px rgba(239,68,68,.06); }

        /* Row 1: dot + name + state badge */
        .db-top {
            display: flex;
            align-items: center;
            gap: .55rem;
        }
        .db-dot {
            width: 8px; height: 8px;
            border-radius: 50%;
            flex-shrink: 0;
            background: var(--idle);
        }
        .db-card.running .db-dot { background: var(--warn); box-shadow: 0 0 8px var(--warn-glow); animation: pulse-dot 1.6s ease-in-out infinite; }
        .db-card.done    .db-dot { background: var(--up);   box-shadow: 0 0 8px var(--up-glow); }
        .db-card.failed  .db-dot { background: var(--err);  box-shadow: 0 0 8px var(--err-glow); }

        .db-name {
            flex: 1;
            min-width: 0;
            font-size: .92rem;
            font-weight: 600;
            color: var(--text);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .db-badge {
            flex-shrink: 0;
            font-size: .62rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: .07em;
            padding: .2rem .5rem;
            border-radius: 999px;
            background: var(--idle-bg);
            color: var(--idle);
            border: 1px solid var(--idle-border);
        }
        .db-card.running .db-badge { background: var(--warn-bg); color: var(--warn); border-color: var(--warn-border); }
        .db-card.done    .db-badge { background: var(--up-bg);   color: var(--up);   border-color: var(--up-border); }
        .db-card.failed  .db-badge { background: var(--err-bg);  color: var(--err);  border-color: var(--err-border); }

        /* Row 2: what the database is doing right now */
        .db-step {
            display: flex;
            align-items: flex-start;
            gap: .5rem;
            font-size: .78rem;
            color: var(--text-muted);
            line-height: 1.45;
            min-height: 2.4em;   /* two lines — keeps cards the same height */
        }
        .step-icon {
            flex-shrink: 0;
            width: 18px; height: 18px;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: .62rem;
            background: var(--idle-bg);
            color: var(--idle);
        }
        .db-card.running .step-icon { background: var(--warn-bg); color: var(--warn); }
        .db-card.done    .step-icon { background: var(--up-bg);   color: var(--up); }
        .db-card.failed  .step-icon { background: var(--err-bg);  color: var(--err); }
        .step-text {
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .db-card.failed .step-text { color: var(--err); opacity: .85; }

        /* Row 3: upload size + speed (hidden until the size is known) */
        .db-transfer { display: flex; flex-direction: column; gap: .35rem; }
        .db-transfer[hidden] { display: none; }
        .tr-bar {
            height: 4px;
            border-radius: 999px;
            background: var(--border);
            overflow: hidden;
        }
        .tr-bar span {
            display: block;
            height: 100%;
            width: 0;
            border-radius: 999px;
            background: var(--warn);
            transition: width .4s;
        }
        .db-card.done   .tr-bar span { background: var(--up); }
        .db-card.failed .tr-bar span { background: var(--err); }
        .tr-meta {
            display: flex;
            justify-content: space-between;
            gap: .5rem;
            font-family: var(--mono);
            font-size: .68rem;
            color: var(--text-muted);
        }
        .tr-size strong { color: var(--text); font-weight: 600; }
        .tr-speed { color: var(--warn); }
        .db-card.done   .tr-speed { color: var(--up); }
        .db-card.failed .tr-speed { color: var(--err); }

        /* Row 4: dumped size + compression ratio (hidden until bytes arrive) */
        .db-size {
            font-family: var(--mono);
            font-size: .68rem;
            color: var(--text-muted);
        }
        .db-size[hidden] { display: none; }
        .db-size strong { color: var(--text); font-weight: 600; }

        /* Row 5: pipeline timeline (dump → package → upload) */
        .db-timeline {
            display: flex;
            align-items: flex-start;
        }
        .tl-stage {
            flex: 0 0 auto;
            width: 4.2rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: .3rem;
        }
        .tl-bar {
            flex: 1 1 auto;
            height: 2px;
            margin-top: 5px;      /* aligns with the 12px node's centre */
            background: var(--border);
            border-radius: 2px;
            transition: background .4s;
        }
        .tl-bar.filled { background: var(--up); }
        .tl-node {
            width: 12px; height: 12px;
            border-radius: 50%;
            border: 2px solid var(--border);
            background: var(--bg);
            transition: background .35s, border-color .35s, box-shadow .35s;
        }
        .tl-label {
            font-size: .58rem;
            text-transform: uppercase;
            letter-spacing: .05em;
            color: var(--text-muted);
            opacity: .45;
            transition: opacity .35s, color .35s;
        }
        .tl-stage.completed .tl-node  { background: var(--up); border-color: var(--up); }
        .tl-stage.completed .tl-label { opacity: .9; color: var(--up); }
        .tl-stage.active .tl-node     { background: var(--warn); border-color: var(--warn); animation: pulse-node 1.5s ease-in-out infinite; }
        .tl-stage.active .tl-label    { opacity: 1; color: var(--warn); font-weight: 600; }
        .tl-stage.failed .tl-node     { background: var(--err); border-color: var(--err); box-shadow: 0 0 8px var(--err-glow); }
        .tl-stage.failed .tl-label    { opacity: 1; color: var(--err); font-weight: 600; }

        @keyframes pulse-node {
            0%, 100% { box-shadow: 0 0 5px var(--warn-glow);  transform: scale(1); }
            50%      { box-shadow: 0 0 13px var(--warn-glow); transform: scale(1.25); }
        }

        /* Row 4: stage counter + last update */
        .db-foot {
            display: flex;
            justify-content: space-between;
            gap: .5rem;
            font-family: var(--mono);
            font-size: .64rem;
            color: var(--text-muted);
            opacity: .6;
        }

        /* ---------- controls ---------- */
        .controls {
            margin-top: 2rem;
            display: flex;
            gap: .75rem;
        }
        .btn {
            display: inline-flex;
            align-items: center;
            gap: .45rem;
            padding: .55rem 1.15rem;
            border-radius: 999px;
            border: 1px solid var(--border);
            background: var(--bg-card);
            color: var(--text);
            font-size: .82rem;
            font-weight: 500;
            cursor: pointer;
            transition: background .2s, border-color .2s;
            font-family: var(--font);
        }
        .btn:hover { background: var(--bg-hover); }
        .btn.primary { border-color: var(--accent); color: var(--accent); }
        .btn.primary:hover { background: rgba(59,130,246,.10); }
        .spinner {
            display: inline-block;
            width: 14px; height: 14px;
            border: 2px solid var(--text-muted);
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin .6s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* ---------- skeleton loader ---------- */
        .skeleton {
            height: 10px;
            border-radius: 6px;
            background: linear-gradient(90deg, var(--bg-card) 25%, var(--bg-hover) 50%, var(--bg-card) 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s ease-in-out infinite;
        }
        @keyframes shimmer {
            0%   { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        /* ---------- footer ---------- */
        .footer {
            margin-top: 2.5rem;
            font-size: .75rem;
            color: var(--text-muted);
            opacity: .6;
        }

        @media (max-width: 640px) {
            .db-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <!-- Header -->
    <div class="header">
        <h1><span class="dot"></span>crab-dump</h1>
        <p>Backup pipeline dashboard &middot; PostgreSQL → Telegram</p>
    </div>

    <!-- Server info bar -->
    <div class="info-bar">
        <span class="info-chip"><span class="icon">&#x1f310;</span> Host: <strong id="infoHost">—</strong></span>
        <span class="info-chip"><span class="icon">&#x1f3e2;</span> Port: <strong id="infoPort">—</strong></span>
        <span class="info-chip"><span class="icon">&#x23f1;</span> Uptime: <strong id="infoUptime">—</strong></span>
    </div>

    <!-- Main status grid (Telegram + aggregated dump) -->
    <div class="grid">

        <!-- Telegram card -->
        <div class="card up" id="tgCard">
            <div class="card-header">
                <span class="status-dot" id="tgDot"></span>
                <span class="card-title">Telegram API</span>
            </div>
            <div class="card-body">
                <div class="status-msg" id="tgMsg">
                    <div class="skeleton" style="width:80%"></div>
                </div>
                <div class="status-time" id="tgTime"></div>
            </div>
        </div>

        <!-- Dump card (aggregated across all databases) -->
        <div class="card up" id="dumpCard">
            <div class="card-header">
                <span class="status-dot" id="dumpDot"></span>
                <span class="card-title">PostgreSQL Dump</span>
            </div>
            <div class="card-body">
                <div class="status-msg" id="dumpMsg">
                    <div class="skeleton" style="width:80%"></div>
                </div>
                <div class="status-time" id="dumpTime"></div>
            </div>
        </div>

    </div>

    <!-- Database-level overview (rendered dynamically) -->
    <div id="dbSection" style="display:none;">
        <div class="db-head">
            <h2>Databases</h2>
            <span class="hint">dump → package → upload</span>
        </div>
        <div class="summary-row" id="dbSummary"></div>
        <div class="db-grid" id="dbGrid"></div>
    </div>

    <!-- Controls -->
    <div class="controls">
        <button class="btn primary" id="refreshBtn" onclick="refreshDashboard()">
            <span id="refreshIcon">&#x1f504;</span> Refresh
        </button>
    </div>

    <!-- Footer -->
    <div class="footer">crab-dump &middot; Dashboard auto-refreshes every 2 s</div>

<script>
    /**
     * crab-dump Status Dashboard
     *
     * Polls the backend API every 2 seconds and updates the UI in real time.
     * On first load it fetches /api/config for server metadata, then displays
     * per-database cards with state, next step, and a backup-pipeline timeline.
     */

    let config = null;

    // ── Helpers ────────────────────────────────────────────────────
    function formatUptime(seconds) {
        const h = Math.floor(seconds / 3600);
        const m = Math.floor((seconds % 3600) / 60);
        const s = seconds % 60;
        if (h > 0) return `${h}h ${m}m ${s}s`;
        if (m > 0) return `${m}m ${s}s`;
        return `${s}s`;
    }

    function relTime(dateStr) {
        try {
            const diff = Date.now() - new Date(dateStr).getTime();
            const abs = Math.abs(diff);
            if (abs < 3000)  return 'just now';
            if (abs < 60000) return `${Math.round(abs / 1000)}s ago`;
            if (abs < 3600000) return `${Math.round(abs / 60000)}m ago`;
            return `${Math.round(abs / 3600000)}h ago`;
        } catch { return dateStr; }
    }

    /** Format a byte count with binary units (KiB = 1024 B). */
    function fmtBytes(n) {
        if (!n || n < 0) return '0 B';
        const units = ['B', 'KiB', 'MiB', 'GiB', 'TiB'];
        const i = Math.min(Math.floor(Math.log(n) / Math.log(1024)), units.length - 1);
        const v = n / Math.pow(1024, i);
        return `${v.toFixed(i === 0 || v >= 10 ? 0 : 1)} ${units[i]}`;
    }

    /** Format throughput; a dash when nothing is moving. */
    function fmtSpeed(bps) {
        return bps > 0 ? `${fmtBytes(bps)}/s` : '—';
    }

    // ── Info bar ───────────────────────────────────────────────────
    async function loadConfig() {
        try {
            const res = await fetch('/api/config');
            if (!res.ok) throw new Error(`HTTP ${res.status}`);
            config = await res.json();
            document.getElementById('infoHost').textContent = config.hostname;
            document.getElementById('infoPort').textContent = config.port;
            uptimeSecs = config.uptime_seconds;
            document.getElementById('infoUptime').textContent = formatUptime(uptimeSecs);
            startUptimeTimer();
        } catch (err) { console.warn('Failed to load config:', err); }
    }

    // Uptime ticks locally — only the starting value comes from the server.
    let uptimeSecs = 0;
    let uptimeTimer = null;
    function startUptimeTimer() {
        if (uptimeTimer) return;
        uptimeTimer = setInterval(() => {
            document.getElementById('infoUptime').textContent = formatUptime(++uptimeSecs);
        }, 1000);
    }

    // ── Card helpers ───────────────────────────────────────────────
    function applyState(card, dot, state) {
        card.classList.remove('up', 'degraded', 'down');
        card.classList.add(state.toLowerCase());
        dot.style.animation = 'pulse-dot 2s ease-in-out infinite';
    }

    function setStatus(msgEl, timeEl, state, message, timestamp) {
        const colorMap = { 'UP':'var(--up)', 'DEGRADED':'var(--warn)', 'DOWN':'var(--err)' };
        const color = colorMap[state] || 'var(--text-muted)';
        msgEl.innerHTML = `<span style="color:${color};font-weight:600;font-size:.75rem;text-transform:uppercase;letter-spacing:.04em;margin-bottom:.35rem;display:inline-block;">${state}</span><br>${message}`;
        if (timestamp) {
            try { timeEl.textContent = new Date(timestamp).toLocaleString(); }
            catch { timeEl.textContent = timestamp; }
        }
    }

    // ── Database card rendering ────────────────────────────────────

    /** Ordered pipeline stages drawn as timeline nodes — must match src/web.rs. */
    const STAGES = ['dump', 'package', 'upload'];

    /** Icon for the current-step line, keyed by backend stage. */
    const STEP_ICON = { queued: '◌', dump: '↓', package: '▣', upload: '↑', done: '✓' };

    /** Card elements keyed by database name, so polling updates them in place. */
    const dbCards = new Map();

    /**
     * Derive display state from the backend's (state, stage) pair.
     *
     * `idx` is the position of the current stage in STAGES:
     *   -1              → not started yet (queued)
     *   0..len-1        → that stage is active (or failed)
     *   STAGES.length   → every stage finished
     */
    function dbView(db) {
        const idx = STAGES.indexOf(db.stage);
        if (db.state === 'DOWN')  return { cls: 'failed',  badge: 'FAILED',  idx: Math.max(idx, 0), failed: true };
        if (db.stage === 'done')  return { cls: 'done',    badge: 'DONE',    idx: STAGES.length,    failed: false };
        if (idx < 0)              return { cls: 'queued',  badge: 'QUEUED',  idx: -1,               failed: false };
        return { cls: 'running', badge: 'RUNNING', idx, failed: false };
    }

    /**
     * Build an empty database card. Text and state classes are filled in by
     * updateDbCard() so the 2-second poll never rebuilds the DOM (no flicker,
     * no lost hover, no restarted animations).
     *
     * Layout (top → bottom):
     *   1. dot + name + state badge
     *   2. current/next step description
     *   3. upload size + speed (once the payload size is known)
     *   4. dumped size + compression ratio (once bytes have been dumped)
     *   5. pipeline timeline (dump → package → upload)
     *   6. step counter + relative timestamp
     */
    function buildDbCard() {
        const el = document.createElement('article');
        el.className = 'db-card';
        el.innerHTML = `
            <div class="db-top">
                <span class="db-dot"></span>
                <span class="db-name"></span>
                <span class="db-badge"></span>
            </div>
            <div class="db-step">
                <span class="step-icon"></span>
                <span class="step-text"></span>
            </div>
            <div class="db-transfer" hidden>
                <div class="tr-bar"><span></span></div>
                <div class="tr-meta">
                    <span class="tr-size"></span>
                    <span class="tr-speed"></span>
                </div>
            </div>
            <div class="db-size" hidden></div>
            <div class="db-timeline">
                ${STAGES.map((s, i) => `${i ? '<span class="tl-bar"></span>' : ''}
                <span class="tl-stage">
                    <span class="tl-node"></span>
                    <span class="tl-label">${s}</span>
                </span>`).join('')}
            </div>
            <div class="db-foot">
                <span class="db-stage"></span>
                <span class="db-updated"></span>
            </div>`;
        return el;
    }

    /**
     * Map a view state to timeline CSS classes.
     *
     * `nodes[i]` styles stage i; `bars[i]` styles the connector between
     * stage i and stage i+1, which fills once stage i is done.
     */
    function timelineClasses(v) {
        return {
            nodes: STAGES.map((_, i) =>
                v.failed && i === v.idx ? 'failed' :
                i < v.idx              ? 'completed' :
                i === v.idx            ? 'active' : ''),
            bars: STAGES.slice(1).map((_, i) => (i < v.idx ? 'filled' : '')),
        };
    }

    /**
     * Build the dumped-size line: the uncompressed size read from pg_dump,
     * plus how much smaller the uploaded payload turned out to be.
     *
     * Returns '' when nothing has been dumped yet, so the row stays hidden.
     * The ratio only appears once the payload size is known (after packaging).
     */
    function sizeLine(db) {
        const dump = db.dump_bytes || 0;
        if (dump <= 0) return '';
        const total = db.bytes_total || 0;
        const size = `dump <strong>${fmtBytes(dump)}</strong>`;
        return total > 0
            ? `${size} &nbsp;·&nbsp; compressed ${(dump / total).toFixed(1)}x`
            : size;
    }

    /** Apply one database's status to an existing card. Returns its view state. */
    function updateDbCard(el, db) {
        const v = dbView(db);
        el.className = `db-card ${v.cls}`;

        const name = el.querySelector('.db-name');
        name.textContent = db.name;
        name.title = db.name;
        el.querySelector('.db-badge').textContent = v.badge;

        el.querySelector('.step-icon').textContent = STEP_ICON[db.stage] || '○';
        const step = el.querySelector('.step-text');
        step.textContent = db.detail || '—';
        step.title = db.detail || '';   // full text for clamped/long errors

        // Upload size + speed. Hidden until packaging reports the total, since
        // the dump is streamed and its final size is unknown before then.
        const transfer = el.querySelector('.db-transfer');
        const total = db.bytes_total || 0;
        transfer.hidden = total <= 0;
        if (total > 0) {
            const done = Math.min(db.bytes_done || 0, total);
            transfer.querySelector('.tr-bar span').style.width = `${(done / total) * 100}%`;
            transfer.querySelector('.tr-size').innerHTML =
                `<strong>${fmtBytes(done)}</strong> / ${fmtBytes(total)}`;
            transfer.querySelector('.tr-speed').textContent = fmtSpeed(db.speed_bps || 0);
        }

        // Logical dump size — grows live during the dump stage, then stays put.
        const size = el.querySelector('.db-size');
        const sizeHtml = sizeLine(db);
        size.hidden = !sizeHtml;
        size.innerHTML = sizeHtml;

        const tl = timelineClasses(v);
        el.querySelectorAll('.tl-stage').forEach((node, i) => {
            node.className = `tl-stage ${tl.nodes[i]}`;
        });
        el.querySelectorAll('.tl-bar').forEach((bar, i) => {
            bar.className = `tl-bar ${tl.bars[i]}`;
        });

        el.querySelector('.db-stage').textContent =
            v.idx >= 0 && v.idx < STAGES.length
                ? `step ${v.idx + 1}/${STAGES.length} · ${db.stage}`
                : db.stage;

        const updated = el.querySelector('.db-updated');
        updated.textContent = relTime(db.timestamp);
        try { updated.title = new Date(db.timestamp).toLocaleString(); }
        catch { updated.title = db.timestamp; }

        return v;
    }

    /**
     * Render the database section: summary pills + one card per database.
     * Auto-hides the section when there are zero databases.
     */
    function renderDatabases(databases) {
        const section = document.getElementById('dbSection');
        const grid = document.getElementById('dbGrid');
        const summary = document.getElementById('dbSummary');

        if (!databases || databases.length === 0) {
            section.style.display = 'none';
            grid.innerHTML = '';
            dbCards.clear();
            return;
        }
        section.style.display = 'block';

        // Create-or-update each card, counting states and transfer totals.
        const count = { queued: 0, running: 0, done: 0, failed: 0 };
        let bytesDone = 0, bytesTotal = 0, speed = 0;
        databases.forEach(db => {
            let el = dbCards.get(db.name);
            if (!el) {
                el = buildDbCard();
                dbCards.set(db.name, el);
                grid.appendChild(el);
            }
            count[updateDbCard(el, db).cls]++;
            bytesDone  += db.bytes_done  || 0;
            bytesTotal += db.bytes_total || 0;
            speed      += db.speed_bps   || 0;   // databases upload in parallel
        });

        // Drop cards for databases no longer present in the payload.
        const live = new Set(databases.map(db => db.name));
        dbCards.forEach((el, name) => {
            if (!live.has(name)) { el.remove(); dbCards.delete(name); }
        });

        const pill = (cls, n, label) =>
            `<span class="summary-pill ${cls}${n ? '' : ' zero'}">${n} ${label}</span>`;
        const pills = [
            pill('total', databases.length, 'total'),
            pill('queued', count.queued, 'queued'),
            pill('running', count.running, 'running'),
            pill('done', count.done, 'done'),
            pill('failed', count.failed, 'failed'),
        ];
        if (bytesTotal > 0) {
            pills.push(`<span class="summary-pill size">&#x2191; ${fmtBytes(bytesDone)} / ${fmtBytes(bytesTotal)}</span>`);
        }
        if (speed > 0) {
            pills.push(`<span class="summary-pill speed">${fmtSpeed(speed)}</span>`);
        }
        summary.innerHTML = pills.join('');
    }

    // ── Fetch logic ────────────────────────────────────────────────
    async function fetchStatus(endpoint) {
        const res = await fetch(endpoint);
        if (!res.ok) throw new Error(`HTTP ${res.status} ${res.statusText}`);
        return res.json();
    }

    async function refreshDashboard() {
        const btn = document.getElementById('refreshBtn');
        const icon = document.getElementById('refreshIcon');
        btn.disabled = true;
        icon.innerHTML = '<span class="spinner"></span>';

        try {
            await Promise.all([
                fetchStatus('/api/status/service').then(data => {
                    applyState(document.getElementById('tgCard'), document.getElementById('tgDot'), data.state);
                    setStatus(document.getElementById('tgMsg'), document.getElementById('tgTime'), data.state, data.message, data.timestamp);
                }),
                fetchStatus('/api/status/process').then(data => {
                    applyState(document.getElementById('dumpCard'), document.getElementById('dumpDot'), data.state);
                    setStatus(document.getElementById('dumpMsg'), document.getElementById('dumpTime'), data.state, data.message, data.timestamp);
                }),
                fetchStatus('/api/status/databases').then(data => {
                    renderDatabases(data);
                }),
            ]);
        } catch (err) {
            console.error('Refresh error:', err);
        } finally {
            btn.disabled = false;
            icon.textContent = '\u{1f504}';
        }
    }

    // ── Mouse glow effect ──────────────────────────────────────────
    // Only the card under the pointer needs updating — looping over every
    // card on each mousemove gets expensive once many databases are listed.
    document.addEventListener('mousemove', (e) => {
        const card = e.target.closest?.('.card, .db-card');
        if (!card) return;
        const r = card.getBoundingClientRect();
        card.style.setProperty('--mx', (e.clientX - r.left) + 'px');
        card.style.setProperty('--my', (e.clientY - r.top) + 'px');
    });

    // ── Init ───────────────────────────────────────────────────────
    async function init() {
        await Promise.all([ loadConfig(), refreshDashboard() ]);
        setInterval(refreshDashboard, 2000);
    }
    window.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
