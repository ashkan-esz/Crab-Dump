<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>pg-backup-tg · Status Dashboard</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg:         #0b0f19;
            --bg-card:    #111827;
            --bg-hover:   #1a2332;
            --border:     #1e293b;
            --text:       #e2e8f0;
            --text-muted: #64748b;
            --accent:     #3b82f6;
            --accent-glow:rgba(59,130,246,.25);
            --up:         #22c55e;
            --up-bg:      rgba(34,197,94,.10);
            --up-border:  rgba(34,197,94,.30);
            --up-glow:    rgba(34,197,94,.35);
            --warn:       #f59e0b;
            --warn-bg:    rgba(245,158,11,.10);
            --warn-border:rgba(245,158,11,.30);
            --warn-glow:  rgba(245,158,11,.35);
            --err:        #ef4444;
            --err-bg:     rgba(239,68,68,.10);
            --err-border: rgba(239,68,68,.30);
            --err-glow:   rgba(239,68,68,.35);
            --radius:     14px;
            --font:       'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            --mono:       'JetBrains Mono', 'Fira Code', 'Cascadia Code', ui-monospace, monospace;
        }

        body {
            font-family: var(--font);
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2rem 1rem;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* ---------- header ---------- */
        .header {
            width: 100%;
            max-width: 900px;
            text-align: center;
            margin-bottom: 2rem;
        }
        .header h1 {
            font-size: 1.6rem;
            font-weight: 700;
            letter-spacing: -.02em;
            margin-bottom: .3rem;
        }
        .header h1 .dot {
            display: inline-block;
            width: 10px; height: 10px;
            border-radius: 50%;
            background: var(--accent);
            box-shadow: 0 0 10px var(--accent-glow);
            margin-right: .5rem;
            vertical-align: middle;
            animation: pulse-dot 2s ease-in-out infinite;
        }
        @keyframes pulse-dot {
            0%,100% { opacity:1; transform:scale(1); }
            50%     { opacity:.5; transform:scale(1.2); }
        }
        .header p {
            color: var(--text-muted);
            font-size: .9rem;
        }

        /* ---------- server info bar ---------- */
        .info-bar {
            width: 100%;
            max-width: 900px;
            display: flex;
            flex-wrap: wrap;
            gap: .75rem;
            margin-bottom: 1.5rem;
        }
        .info-chip {
            display: inline-flex;
            align-items: center;
            gap: .45rem;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 999px;
            padding: .4rem .9rem;
            font-size: .78rem;
            color: var(--text-muted);
            font-family: var(--mono);
            white-space: nowrap;
        }
        .info-chip .icon { font-size: .9rem; }
        .info-chip strong { color: var(--text); font-weight: 600; }

        /* ---------- status grid ---------- */
        .grid {
            width: 100%;
            max-width: 900px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.25rem;
        }
        @media (max-width: 640px) {
            .grid { grid-template-columns: 1fr; }
        }

        /* ---------- card ---------- */
        .card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 1.5rem;
            transition: border-color .3s, box-shadow .3s, transform .15s;
            display: flex;
            flex-direction: column;
            gap: 1rem;
            position: relative;
            overflow: hidden;
        }
        .card::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: var(--radius);
            opacity: 0;
            transition: opacity .3s;
            pointer-events: none;
            background: radial-gradient(600px circle at var(--mx, 50%) var(--my, 50%), rgba(255,255,255,.02), transparent 40%);
        }
        .card:hover::before { opacity: 1; }
        .card:hover { transform: translateY(-2px); }

        /* state variants */
        .card.up       { border-color: var(--up-border);   box-shadow: 0 0 20px rgba(34,197,94,.06); }
        .card.up .card-header .status-dot { background: var(--up); box-shadow: 0 0 10px var(--up-glow); }
        .card.degraded { border-color: var(--warn-border); box-shadow: 0 0 20px rgba(245,158,11,.06); }
        .card.degraded .card-header .status-dot { background: var(--warn); box-shadow: 0 0 10px var(--warn-glow); }
        .card.down     { border-color: var(--err-border);  box-shadow: 0 0 20px rgba(239,68,68,.06); }
        .card.down .card-header .status-dot { background: var(--err); box-shadow: 0 0 10px var(--err-glow); }

        .card-header {
            display: flex;
            align-items: center;
            gap: .75rem;
        }
        .status-dot {
            width: 12px; height: 12px;
            border-radius: 50%;
            flex-shrink: 0;
            animation: pulse-dot 2s ease-in-out infinite;
        }
        .card-title {
            font-size: .95rem;
            font-weight: 600;
            color: var(--text);
        }
        .card-body {
            flex: 1;
        }
        .card-body .status-msg {
            font-size: .85rem;
            color: var(--text-muted);
            line-height: 1.55;
        }
        .card-body .status-time {
            font-family: var(--mono);
            font-size: .72rem;
            color: var(--text-muted);
            opacity: .7;
            margin-top: .4rem;
        }

        /* ---------- full-width card ---------- */
        .card.full {
            grid-column: 1 / -1;
        }
        .card.full .card-body {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: .75rem;
        }
        @media (max-width: 640px) {
            .card.full .card-body { grid-template-columns: 1fr; }
        }

        /* ---------- controls ---------- */
        .controls {
            display: flex;
            gap: .75rem;
            flex-wrap: wrap;
            width: 100%;
            max-width: 900px;
            margin-top: 1.5rem;
            justify-content: center;
        }
        .btn {
            display: inline-flex;
            align-items: center;
            gap: .4rem;
            padding: .55rem 1.2rem;
            border-radius: 999px;
            border: 1px solid var(--border);
            background: var(--bg-card);
            color: var(--text);
            font-size: .82rem;
            font-family: var(--font);
            cursor: pointer;
            transition: background .2s, border-color .2s;
        }
        .btn:hover { background: var(--bg-hover); border-color: var(--accent); }
        .btn:disabled { opacity: .5; cursor: not-allowed; }
        .btn.primary {
            background: var(--accent);
            border-color: var(--accent);
            color: #fff;
        }
        .btn.primary:hover { background: #2563eb; }

        /* ---------- footer ---------- */
        .footer {
            margin-top: 2.5rem;
            color: var(--text-muted);
            font-size: .72rem;
            text-align: center;
            opacity: .5;
        }

        /* ---------- spinner ---------- */
        .spinner {
            display: inline-block;
            width: 14px; height: 14px;
            border: 2px solid rgba(255,255,255,.15);
            border-top-color: currentColor;
            border-radius: 50%;
            animation: spin .6s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* ---------- shimmer skeleton ---------- */
        .skeleton {
            background: linear-gradient(90deg, var(--bg-card) 25%, var(--bg-hover) 50%, var(--bg-card) 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s ease-in-out infinite;
            border-radius: 6px;
            height: 14px;
        }
        @keyframes shimmer { to { background-position: -200% 0; } }
    </style>
</head>
<body>

<!-- Header -->
<div class="header">
    <h1><span class="dot" id="mainDot"></span>pg-backup-tg</h1>
    <p>PostgreSQL backup pipeline &mdash; Telegram delivery</p>
</div>

<!-- Server info bar -->
<div class="info-bar" id="infoBar">
    <div class="info-chip"><span class="icon">&#x1f5a5;&#xfe0f;</span> <strong id="infoHost">loading...</strong></div>
    <div class="info-chip"><span class="icon">&#x1f50c;</span> Port <strong id="infoPort">—</strong></div>
    <div class="info-chip"><span class="icon">&#x23f1;&#xfe0f;</span> Uptime <strong id="infoUptime">—</strong></div>
</div>

<!-- Status grid -->
<div class="grid">

    <!-- Telegram card -->
    <div class="card up" id="tgCard">
        <div class="card-header">
            <span class="status-dot" id="tgDot"></span>
            <span class="card-title">Telegram API</span>
        </div>
        <div class="card-body">
            <div class="status-msg" id="tgMsg">
                <div class="skeleton" style="width:80%"></div>
            </div>
            <div class="status-time" id="tgTime"></div>
        </div>
    </div>

    <!-- Dump card -->
    <div class="card up" id="dumpCard">
        <div class="card-header">
            <span class="status-dot" id="dumpDot"></span>
            <span class="card-title">PostgreSQL Dump</span>
        </div>
        <div class="card-body">
            <div class="status-msg" id="dumpMsg">
                <div class="skeleton" style="width:80%"></div>
            </div>
            <div class="status-time" id="dumpTime"></div>
        </div>
    </div>

</div>

<!-- Controls -->
<div class="controls">
    <button class="btn primary" id="refreshBtn" onclick="refreshDashboard()">
        <span id="refreshIcon">&#x1f504;</span> Refresh
    </button>
</div>

<!-- Footer -->
<div class="footer">pg-backup-tg &middot; Dashboard auto-refreshes every 2 s</div>

<script>
    /**
     * pg-backup-tg Status Dashboard
     *
     * This script polls the backend API every 2 seconds and updates
     * the UI in real time. On first load it fetches /api/config to
     * discover the server port, uptime, and hostname.
     */

    // ── State ──────────────────────────────────────────────────────
    /** Server metadata cached from /api/config. */
    let config = null;

    // ── Info bar helpers ───────────────────────────────────────────
    /** Convert seconds to a human-readable uptime string. */
    function formatUptime(seconds) {
        const h = Math.floor(seconds / 3600);
        const m = Math.floor((seconds % 3600) / 60);
        const s = seconds % 60;
        if (h > 0) return `${h}h ${m}m ${s}s`;
        if (m > 0) return `${m}m ${s}s`;
        return `${s}s`;
    }

    /** Fetch /api/config and populate the server info chips. */
    async function loadConfig() {
        try {
            const res = await fetch('/api/config');
            if (!res.ok) throw new Error(`HTTP ${res.status}`);
            config = await res.json();

            document.getElementById('infoHost').textContent = config.hostname;
            document.getElementById('infoPort').textContent = config.port;
            document.getElementById('infoUptime').textContent = formatUptime(config.uptime_seconds);

            // Start a 1-second timer so uptime counter ticks live.
            startUptimeTimer();
        } catch (err) {
            console.warn('Failed to load config:', err);
        }
    }

    /** Refresh the uptime chip every second. */
    let uptimeTimer = null;
    function startUptimeTimer() {
        if (uptimeTimer) clearInterval(uptimeTimer);
        uptimeTimer = setInterval(loadConfig, 1000);
    }

    // ── Card helpers ───────────────────────────────────────────────
    /**
     * Apply the visual state class to a card and its dot.
     * @param {HTMLElement} card  - The card div element.
     * @param {HTMLElement} dot   - The status dot element.
     * @param {string} state      - "UP", "DEGRADED", or "DOWN".
     */
    function applyState(card, dot, state) {
        card.classList.remove('up', 'degraded', 'down');
        card.classList.add(state.toLowerCase());
        dot.style.animation = 'pulse-dot 2s ease-in-out infinite';
    }

    /**
     * Write status data into a card's message area.
     * @param {HTMLElement} msgEl   - The message paragraph.
     * @param {HTMLElement} timeEl  - The timestamp element.
     * @param {string} state        - State label (UP, DEGRADED, DOWN).
     * @param {string} message      - Human-readable message.
     * @param {string} timestamp    - ISO 8601 timestamp string.
     */
    function setStatus(msgEl, timeEl, state, message, timestamp) {
        const colorMap = {
            'UP': 'var(--up)',
            'DEGRADED': 'var(--warn)',
            'DOWN': 'var(--err)',
        };
        const color = colorMap[state] || 'var(--text-muted)';

        msgEl.innerHTML = `
            <span style="color:${color}; font-weight:600; font-size:.75rem; text-transform:uppercase; letter-spacing:.04em; margin-bottom:.35rem; display:inline-block;">${state}</span>
            <br>${message}`;

        if (timestamp) {
            try {
                const d = new Date(timestamp);
                timeEl.textContent = d.toLocaleString();
            } catch {
                timeEl.textContent = timestamp;
            }
        }
    }

    // ── Fetch logic ────────────────────────────────────────────────
    /**
     * Fetch a JSON status endpoint and throw on HTTP error.
     * Uses relative URLs so the dashboard works when the page is
     * served from any host — critical for remote server access.
     * @param {string} endpoint - API path like '/api/status/service'.
     * @returns {Promise<object>} Parsed JSON response.
     */
    async function fetchStatus(endpoint) {
        const res = await fetch(endpoint);
        if (!res.ok) throw new Error(`HTTP ${res.status} ${res.statusText}`);
        return res.json();
    }

    /**
     * Manually trigger a status refresh for both cards.
     * The refresh button disables while in-flight to prevent spam.
     */
    async function refreshDashboard() {
        const btn = document.getElementById('refreshBtn');
        const icon = document.getElementById('refreshIcon');
        btn.disabled = true;
        icon.innerHTML = '<span class="spinner"></span>';

        try {
            await Promise.all([
                fetchStatus('/api/status/service').then(data => {
                    const card = document.getElementById('tgCard');
                    const dot = document.getElementById('tgDot');
                    applyState(card, dot, data.state);
                    setStatus(document.getElementById('tgMsg'), document.getElementById('tgTime'), data.state, data.message, data.timestamp);
                }),
                fetchStatus('/api/status/process').then(data => {
                    const card = document.getElementById('dumpCard');
                    const dot = document.getElementById('dumpDot');
                    applyState(card, dot, data.state);
                    setStatus(document.getElementById('dumpMsg'), document.getElementById('dumpTime'), data.state, data.message, data.timestamp);
                }),
            ]);
        } catch (err) {
            console.error('Refresh error:', err);
        } finally {
            btn.disabled = false;
            icon.textContent = '\u{1f504}';
        }
    }

    // ── Mouse glow effect ──────────────────────────────────────────
    /**
     * Track mouse position inside each card so the radial-gradient
     * pseudo-element follows the cursor for a subtle spotlight effect.
     */
    document.addEventListener('mousemove', (e) => {
        document.querySelectorAll('.card').forEach(card => {
            const r = card.getBoundingClientRect();
            card.style.setProperty('--mx', (e.clientX - r.left) + 'px');
            card.style.setProperty('--my', (e.clientY - r.top) + 'px');
        });
    });

    // ── Init ───────────────────────────────────────────────────────
    /**
     * On DOM ready, fetch config + run initial status poll in parallel,
     * then start the 2-second polling loop.
     */
    async function init() {
        await Promise.all([
            loadConfig(),
            refreshDashboard(),
        ]);
        // Poll status endpoints every 2 seconds.
        setInterval(refreshDashboard, 2000);
    }

    window.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
