# Note: the container has its own network namespace. If your Postgres or
# SOCKS proxy runs on the Docker host, use host.docker.internal (enabled below)
# or the host's LAN IP instead of 127.0.0.1.

services:
  postgres:
    image: postgres:17-alpine
    network_mode: host
    privileged: true
    command:
      - postgres
      - -c
      - listen_addresses=127.0.0.1
      - -c
      - shared_buffers=32MB
      - -c
      - max_connections=20
      - -c
      - work_mem=1MB
      - -c
      - maintenance_work_mem=16MB
      - -c
      - max_wal_size=256MB
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      POSTGRES_DB: ${POSTGRES_DB:-app}
    volumes:
      - crab_dump_postgres:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: "unless-stopped"
    shm_size: "128mb"
    mem_limit: "700mb"

  crab-dump:
    image: ${IMAGE_TAG:-ghcr.io/ashkan-esz/crab-dump:latest}
    network_mode: host
    privileged: true
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      API_PORT: "1111"
      DASHBOARD_HOST: "0.0.0.0"
      HISTORY_DIR: /app/history
      WORK_DIR: /app/work
      MAX_PARALLEL_DATABASES: "1"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - crab_dump_history:/app/history
      - crab_dump_data:/app/data
      - crab_dump_temp:/app/tmp
    restart: "unless-stopped"
    cpus: "0.20"
    mem_limit: "50mb"
    memswap_limit: "50mb"

volumes:
  crab_dump_postgres:
  crab_dump_history:
  crab_dump_data:
  crab_dump_temp:
