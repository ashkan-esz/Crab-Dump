# Note: the container has its own network namespace. If your Postgres or
# SOCKS proxy runs on the Docker host, use host.docker.internal (enabled below)
# or the host's LAN IP instead of 127.0.0.1.

services:
  crab-dump:
    build:
      context: .
      target: ${ROUTING_TARGET:-runtime-none}
    image: ${IMAGE_TAG:-crab-dump:latest}
    env_file: .env
    environment:
      API_PORT: "1111"
      DASHBOARD_HOST: "0.0.0.0"
      HISTORY_DIR: /app/history
      WORK_DIR: /app/work
      MAX_PARALLEL_DATABASES: "1"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - crab_dump_history:/app/history
      - crab_dump_data:/app/data
      - crab_dump_temp:/app/tmp
    ports:
      - "${API_PORT:-1111}:1111"
    restart: "unless-stopped"
    cpus: "0.10"
    mem_limit: "50mb"
    memswap_limit: "50mb"

volumes:
  crab_dump_history:
  crab_dump_data:
  crab_dump_temp:
