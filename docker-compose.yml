# Example: run crab-dump on a schedule via docker-compose.
#
#   docker compose run --rm crab-dump           # one-shot backup
#   docker compose run --rm crab-dump --dry-run # validate config
#
# Put secrets in a .env file next to this compose file (see .env.example).
# Note: the container has its own network namespace. If your Postgres or
# SOCKS proxy runs on the Docker host, use host.docker.internal or the
# host's LAN IP instead of 127.0.0.1.

services:
  crab-dump:
    build: .
    image: crab-dump:latest
    env_file: .env
    environment:
      BACKUP_INTERVAL: "0 */8 * * *"
    restart: "unless-stopped"
