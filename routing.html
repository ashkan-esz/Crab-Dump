<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Routing profiles · crab-dump</title>
<style>
body{max-width:900px;margin:2rem auto;padding:0 1rem;font:15px system-ui;background:#0f172a;color:#dbeafe}
form,li{border:1px solid #334155;border-radius:8px;padding:1rem;margin:1rem 0;background:#111827}
input{display:block;width:100%;box-sizing:border-box;margin:.35rem 0 .75rem;padding:.6rem;background:#0f172a;color:inherit;border:1px solid #475569;border-radius:5px}
button{margin:.2rem;padding:.45rem .7rem;color:inherit;background:#1e293b;border:1px solid #475569;border-radius:5px}
button:disabled{cursor:wait;opacity:.6}.status{min-height:1.4rem;padding:.55rem .7rem;border-radius:5px}.status.error{color:#fecaca;background:#450a0a;border:1px solid #7f1d1d}.status.success{color:#bbf7d0;background:#052e16;border:1px solid #166534}
ul{padding:0;list-style:none}.profile{display:flex;justify-content:space-between;gap:1rem;align-items:center}.muted{color:#94a3b8}.active{color:#86efac}
</style>
<body>
<p><a href="/" style="color:#93c5fd">← dashboard</a></p>
<h1>Routing profiles</h1>
<p class="muted">Credentials are never returned by the API. Mutations require administrator access.</p>
<form id="profileForm">
<label>Name<input id="profileName" required maxlength="100"></label>
<label>Share URL<input id="profileUrl" type="password" required autocomplete="off" placeholder="vmess://, vless://, ss://, or trojan://…"></label>
<button type="submit">Create profile</button>
</form>
<p id="message" class="status muted" role="status" aria-live="polite"></p>
<p><button id="checkAll" onclick="checkAllProfiles()">Check all configurations</button>
<span id="checkSummary" class="muted"></span></p>
<ul id="profiles"></ul>
<script>
const csrf=()=>document.cookie.split('; ').find(v=>v.startsWith('crab_csrf='))?.split('=').slice(1).join('=');
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(path,opt={}){const h={'Content-Type':'application/json',...(opt.headers||{})};if(opt.method)h['x-csrf-token']=csrf()||'';const r=await fetch(path,{...opt,headers:h});if(!r.ok)throw Error((await r.json().catch(()=>({}))).error||`HTTP ${r.status}`);return r.status===204?null:r.json()}
function setMessage(text,tone=''){message.textContent=text;message.className=`status ${tone}`.trim()}
function setProfilesBusy(busy){document.querySelectorAll('#profiles button').forEach(button=>{button.disabled=busy})}
let checkResults={};
async function refresh(){const ps=await api('/api/routing/profiles');profiles.innerHTML=ps.map(p=>{const r=checkResults[p.id];const status=r?`<span class="${r.ok?'active':'muted'}"> · ${r.ok?'CHECK OK':'CHECK FAILED'}${r.error?` (${esc(r.error)})`:''}</span>`:'';return `<li class="profile"><span><b>${esc(p.name)}</b> · ${p.kind} <span class="${p.active?'active':'muted'}">${p.active?'ACTIVE':''}</span>${status}</span><span><button onclick="testP('${p.id}')">Test</button><button onclick="applyP('${p.id}')">Apply</button>${p.active?'<button onclick="disableRouting()">Disable</button>':''}<button onclick="deleteP('${p.id}')">Delete</button></span></li>`}).join('')||'<li class="muted">No profiles saved.</li>'}
async function testP(id){try{const r=await api(`/api/routing/profiles/${id}/test`,{method:'POST'});setMessage(`Valid ${r.kind} profile (${r.transport||'tcp'})`,'success')}catch(e){setMessage(e.message,'error')}}
async function checkAllProfiles(){const button=document.getElementById('checkAll');button.disabled=true;checkSummary.textContent='Checking…';try{const r=await api('/api/routing/profiles/check-all',{method:'POST'});checkResults=Object.fromEntries(r.results.map(x=>[x.id,x]));checkSummary.textContent=`${r.passed}/${r.checked} passed`;message.textContent=r.valid?'All configurations passed':'Some configurations failed';await refresh()}catch(e){checkSummary.textContent=e.message}finally{button.disabled=false}}
async function applyP(id){setProfilesBusy(true);try{await api(`/api/routing/profiles/${id}/apply`,{method:'POST'});setMessage('Profile applied','success');await refresh()}catch(e){setMessage(e.message,'error')}finally{setProfilesBusy(false)}}
async function disableRouting(){if(!confirm('Disable the active routing profile? Saved profiles will remain available.'))return;setProfilesBusy(true);try{await api('/api/routing/disable',{method:'POST'});setMessage('Routing disabled','success');await refresh()}catch(e){setMessage(e.message,'error')}finally{setProfilesBusy(false)}}
async function deleteP(id){if(!confirm('Delete this profile?'))return;try{await api(`/api/routing/profiles/${id}`,{method:'DELETE'});await refresh()}catch(e){setMessage(e.message,'error')}}
profileForm.onsubmit=async e=>{e.preventDefault();try{await api('/api/routing/profiles',{method:'POST',body:JSON.stringify({name:profileName.value,url:profileUrl.value})});profileName.value='';profileUrl.value='';setMessage('Profile created','success');await refresh()}catch(x){setMessage(x.message,'error')}};refresh().catch(e=>setMessage(e.message,'error'));
</script>
</body>
