<style>

.app-nav{position:fixed;inset:0 auto 0 0;display:flex;flex-direction:column;width:248px;padding:1.35rem 1rem;background:#0c121d;border-right:1px solid #334155}.app-brand{display:flex;align-items:center;gap:.7rem;padding:.2rem .55rem 1.7rem;color:#dbeafe;text-decoration:none;font-weight:750}.app-brand .dot{width:9px;height:9px;border-radius:50%;background:#60a5fa}.app-nav-label{margin:1rem .65rem .45rem;color:#94a3b8;font:700 .62rem ui-monospace,monospace;letter-spacing:.12em;text-transform:uppercase}.app-nav-links{display:grid;gap:.25rem}.app-nav-links a{display:flex;gap:.65rem;align-items:center;min-height:38px;padding:.55rem .65rem;border:1px solid transparent;border-radius:7px;color:#94a3b8;text-decoration:none;font-size:.8rem}.app-nav-links a:hover,.app-nav-links a[aria-current=page]{color:#dbeafe;background:#172033;border-color:#334155}.app-nav-links a[aria-current=page]{color:#60a5fa}.app-nav-footer{margin-top:auto;padding:1rem .65rem 0;color:#94a3b8;font:.65rem/1.5 ui-monospace,monospace}main,.routing-main{display:block;width:min(980px,calc(100% - 3rem));margin-left:calc(248px + (100% - 248px - min(980px,calc(100% - 3rem)))/2);padding:1.35rem 0 3rem}.routing-main>h1{margin:.5rem 0 0}.routing-main>form,.routing-main>ul,.routing-main>section,.routing-main>label,.routing-main>p{max-width:980px}button,input,select{font:inherit}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #60a5fa;outline-offset:2px}@media(max-width:900px){.app-nav{width:72px;padding-inline:.55rem;align-items:center}.app-brand{padding-inline:0}.app-brand span:last-child,.app-nav-label,.app-nav-links a span:last-child,.app-nav-footer{display:none}.app-nav-links a{width:42px;justify-content:center;padding-inline:0}.routing-main{width:calc(100% - 120px);margin-left:96px}}@media(max-width:640px){.app-nav{position:static;display:flex;flex-direction:row;align-items:center;width:100%;padding:.65rem .8rem;border-right:0;border-bottom:1px solid #334155}.app-brand{padding:0 .25rem;margin-right:auto}.app-nav-links{display:flex;gap:.2rem}.app-nav-links a{width:auto;min-height:32px;padding:.4rem .5rem}.app-nav-links a span:last-child{display:inline;font-size:.65rem}.routing-main{width:calc(100% - 1.5rem);margin:0 auto;padding-top:1rem}.profile{align-items:flex-start;flex-direction:column}}
</style>

.app-role{display:grid;gap:.25rem;margin:-.9rem .45rem 1rem;padding:.6rem .65rem;border:1px solid #334155;border-radius:7px;background:#111827;color:#94a3b8;font:.62rem/1.3 ui-monospace,monospace}.app-role span{font-size:.56rem;letter-spacing:.08em;text-transform:uppercase}.app-role strong{color:#60a5fa;font-size:.78rem;font-weight:700;text-transform:capitalize}
@media(max-width:640px){.app-nav{overflow-x:auto}.app-nav-links{flex-shrink:0}}
@media(max-width:900px){.app-role{display:none}}@media(max-width:480px){.app-brand span:last-child,.app-nav-links a span:last-child{display:none}.app-nav-links a{width:34px;justify-content:center}}

<body>
<nav class="app-nav" aria-label="Primary navigation">
  <a class="app-brand" href="/" aria-label="crab-dump overview"><span class="dot"></span><span>crab-dump</span></a>
  <div class="app-role" aria-label="Current dashboard role"><span>Current role</span><strong id="sidebarRole">Loading...</strong></div>
  <span class="app-nav-label">Operations</span>
  <div class="app-nav-links">
    <a href="/"><span aria-hidden="true">◈</span><span>Overview</span></a>
    <a href="/databases"><span aria-hidden="true">▤</span><span>Databases</span></a>

  </div>

  <div class="app-nav-links"><a href="/#resourceCard"><span aria-hidden="true">▥</span><span>Resources</span></a><a href="/#compressionCard"><span aria-hidden="true">⚙</span><span>Settings</span></a></div>
  <div class="app-nav-footer">Live status</div>
</nav>
<main class="routing-main">
<p><a href="/">Overview</a></p>
<h1>Routing profiles</h1>
<p class="muted">Credentials are never returned by the API. Mutations require administrator access.</p>
<section id="routingStatus" class="status muted" aria-live="polite">Loading routing state…</section>
<label>Selected routing core
<select id="coreSelect" onchange="selectCore(this.value)">
<option value="sing-box">sing-box</option>
<option value="shoes">shoes</option>
</select>
</label>
<form id="profileForm">
<label>Name<input id="profileName" required maxlength="100"></label>
<label>Share URL<input id="profileUrl" type="password" required autocomplete="off" placeholder="vmess://, vless://, ss://, or trojan://…"></label>
<button type="submit">Create profile</button>
</form>
<p id="message" class="status muted" role="status" aria-live="polite"></p>
<p><button id="checkAll" onclick="checkAllProfiles()">Check all configurations</button>
<span id="checkSummary" class="muted"></span></p>
<ul id="profiles"></ul>
<script>
const csrf=()=>document.cookie.split('; ').find(v=>v.startsWith('crab_csrf='))?.split('=').slice(1).join('=');
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let loginPromise=null;let loginFailed=false;let sessionEstablished=false;
function requestCredentials(){return new Promise(resolve=>{const dialog=document.createElement('dialog');dialog.innerHTML='<form method="dialog"><h2>Dashboard sign in</h2><label>Username<input id="routingLoginUsername" name="routing_login_username" autocomplete="username" required></label><label>Password<input id="routingLoginPassword" name="routing_login_password" type="password" autocomplete="current-password" required></label><menu><button type="button" data-cancel>Cancel</button><button type="submit">Sign in</button></menu></form>';const form=dialog.querySelector('form');const finish=value=>{dialog.close();dialog.remove();resolve(value)};dialog.querySelector('[data-cancel]').onclick=()=>finish(null);dialog.addEventListener('cancel',event=>{event.preventDefault();finish(null)});form.onsubmit=event=>{event.preventDefault();finish({username:form.elements.routing_login_username.value,password:form.elements.routing_login_password.value})};document.body.append(dialog);dialog.showModal();form.elements.routing_login_username.focus()})}
async function ensureSession(){if(sessionEstablished)return true;if(loginFailed)return false;if(loginPromise)return loginPromise;loginPromise=(async()=>{const credentials=await requestCredentials();if(!credentials){loginFailed=true;return false}const login=await fetch('/api/auth/login',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify(credentials)});loginFailed=!login.ok;sessionEstablished=login.ok;return login.ok})().catch(()=>{loginFailed=true;return false}).finally(()=>{loginPromise=null});return loginPromise}
async function api(path,opt={}){const h={'Content-Type':'application/json',...(opt.headers||{})};if(['POST','PUT','DELETE'].includes(opt.method))h['X-CSRF-Token']=csrf()||'';let r=await fetch(path,{credentials:'same-origin',...opt,headers:h});if(r.status===401){sessionEstablished=false;if(await ensureSession()){if(['POST','PUT','DELETE'].includes(opt.method))h['X-CSRF-Token']=csrf()||'';r=await fetch(path,{credentials:'same-origin',...opt,headers:h})}}if(!r.ok)throw Error((await r.json().catch(()=>({}))).error||`HTTP ${r.status}`);return r.status===204?null:r.json()}
function setMessage(text,tone=''){message.textContent=text;message.className=`status ${tone}`.trim()}
function setProfilesBusy(busy){document.querySelectorAll('#profiles button').forEach(button=>{button.disabled=busy})}
let checkResults={};let routingState=null;
async function refresh(){const [ps,s]=await Promise.all([api('/api/routing/profiles'),api('/api/routing/status')]);routingState=s;coreSelect.value=s.selected_core;const routeActive=Boolean(s.active_profile||s.running_core);coreSelect.disabled=routeActive;routingStatus.textContent=`Selected core: ${s.selected_core} · Running core: ${s.running_core||'none'} · Active profile: ${s.active_profile||'none'}${routeActive?' · Disable routing to change core.':''}`;profiles.innerHTML=ps.map(p=>{const r=checkResults[p.id];const compatible=p.compatible_cores||[];const canApply=compatible.includes(s.selected_core);const status=r?`<span class="${r.ok?'active':'muted'}"> · ${r.ok?'CHECK OK':'CHECK FAILED'}${r.error?` (${esc(r.error)})`:''}</span>`:'';return `<li class="profile"><span><b>${esc(p.name)}</b> · ${p.kind} <span class="muted">[${compatible.join(', ')}]</span> <span class="${p.active?'active':'muted'}">${p.active?'ACTIVE':''}</span>${status}${canApply?'':`<span class="muted"> · incompatible with ${esc(s.selected_core)}</span>`}</span><span><button onclick="testP('${p.id}')">Test</button><button onclick="applyP('${p.id}')" ${canApply?'':'disabled'}>Apply</button>${p.active?'<button onclick="disableRouting()">Disable</button>':''}<button onclick="deleteP('${p.id}')">Delete</button></span></li>`}).join('')||'<li class="muted">No profiles saved.</li>'}
async function selectCore(core){try{await api('/api/routing/core',{method:'POST',body:JSON.stringify({core})});setMessage(`Selected ${core}`,'success');await refresh()}catch(e){setMessage(e.message,'error');await refresh()}}
async function testP(id){try{const r=await api(`/api/routing/profiles/${id}/test`,{method:'POST'});setMessage(`Valid ${r.kind} profile (${r.transport||'tcp'})`,'success')}catch(e){setMessage(e.message,'error')}}
async function checkAllProfiles(){const button=document.getElementById('checkAll');button.disabled=true;checkSummary.textContent='Checking…';try{const r=await api('/api/routing/profiles/check-all',{method:'POST'});checkResults=Object.fromEntries(r.results.map(x=>[x.id,x]));checkSummary.textContent=`${r.passed}/${r.checked} passed`;message.textContent=r.valid?'All configurations passed':'Some configurations failed';await refresh()}catch(e){checkSummary.textContent=e.message}finally{button.disabled=false}}
async function applyP(id){setProfilesBusy(true);try{await api(`/api/routing/profiles/${id}/apply`,{method:'POST'});setMessage('Profile applied','success');await refresh()}catch(e){setMessage(e.message,'error')}finally{setProfilesBusy(false)}}
async function disableRouting(){if(!confirm('Disable the active routing profile? Saved profiles will remain available.'))return;setProfilesBusy(true);try{await api('/api/routing/disable',{method:'POST'});setMessage('Routing disabled','success');await refresh()}catch(e){setMessage(e.message,'error')}finally{setProfilesBusy(false)}}
async function deleteP(id){if(!confirm('Delete this profile?'))return;try{await api(`/api/routing/profiles/${id}`,{method:'DELETE'});await refresh()}catch(e){setMessage(e.message,'error')}}
async function loadRole(){try{const c=await api('/api/config');sidebarRole.textContent=c.dashboard_role||'viewer'}catch(e){sidebarRole.textContent='unknown'}}
profileForm.onsubmit=async e=>{e.preventDefault();try{await api('/api/routing/profiles',{method:'POST',body:JSON.stringify({name:profileName.value,url:profileUrl.value})});profileName.value='';profileUrl.value='';setMessage('Profile created','success');await refresh()}catch(x){setMessage(x.message,'error')}};Promise.all([refresh(),loadRole()]).catch(e=>setMessage(e.message,'error'));
</script>
</main>
</body>
